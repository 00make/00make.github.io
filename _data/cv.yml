cv:
  name: 张振尧
  label: 机器人开发者生态 & 全栈具身智能工程师
  email: towardsrwby@gmail.com
  location: 中国·北京
  image: assets/img/prof_pic.jpg
  summary: NVIDIA 生态走出来的机器人技术布道者：年度黑客松冠军 × 200 万受众开发者内容创作者 × 全栈具身智能工程师。既能亲手把大模型在单张消费级显卡上跑通真机闭环，也能把前沿技术生动讲给百万开发者听。曾获人民网、北京日报、解放日报、China Daily、腾讯科技等全网权威主流媒体深度专访与报道。

  social_networks:
    - network: GitHub
      username: 00make
    - network: Bilibili
      username: "超级无敌麻辣串 (UID: 340935808)"
    - network: WeChat
      username: towardsdawn

  sections:
    Experience:
      - company: 零零后（北京）科技有限公司
        position: 创始人 & CEO
        location: 中国·北京
        start_date: 2019-04
        end_date: 至今
        summary: 创立并领导软硬件技术企业，获评国家级中关村高新技术企业与中关村 U30 雏鹰人才企业。
        highlights:
          - 打造具备软硬件全栈研发能力的创新技术团队，自主研发多款智能硬件与大型软件系统。
          - 带领公司入选“中关村高新技术企业”与“中关村雏鹰人才企业”。
          - 主导研发《农村房屋安全管理系统》并于安徽青阳县住建局落地部署，助力乡村振兴与精准脱贫。
          - 开源 treehollow 校园社交平台，覆盖全国 34 所高校，累计服务用户超 10 万+。

      - company: “探月计划·Physical AI黑客松”
        position: 联合发起人
        location: 中国·北京（中关村东升科技园）
        start_date: 2026-07
        end_date: 2026-07
        summary: 国内首个聚焦 Physical AI（物理人工智能）主题的前沿硬核开发者极限赛事。
        highlights:
          - 联合清华大学工业训练中心、中关村科学城管委会、海淀区东升镇政府共同发起，小米集团前总裁王翔等担任创始合伙人。
          - 汇聚来自清华、北大、斯坦福、MIT、UC伯克利等全球顶尖高校与科技企业的 200+ 开发者、50 支战队，提供人形机器人与机械臂真机实操闭环。
          - 接受北京日报专访，倡导构建“永不落幕的具身智能生态”，赋能硬核科技跨越“实验室到市场”鸿沟。

      - company: 北京众绘虚拟现实研究院
        position: 创新研发总监
        location: 中国·北京
        start_date: 2022-09
        end_date: 2025-04
        summary: 主导医疗虚拟现实手术模拟训练系统及硬件产品研发。
        highlights:
          - 主导 5 款医疗模拟产品研发，年营收突破 2000 万元；引入敏捷开发模式，将研发周期缩短 40%。
          - 申请 5 项发明专利，建立多自由度力反馈交互与三维动力学仿真的核心技术壁垒。
          - 负责机构动力学建模、力反馈手柄机构设计与跨平台嵌入式驱动集成。

      - company: Genesis 开源具身 AI 社区
        position: 中国区产品创新与推广负责人
        location: 中国·北京 / 线上
        start_date: 2025-12
        end_date: 至今
        summary: 推动全球开源通用物理仿真与具身智能学习生态发展。
        highlights:
          - 深度链接清华、北化、哈工大等顶尖高校实验室开发者，推动跨本体机器人策略在 Genesis 环境下的训练与评估。
          - 策划组织开发者 Workshop、技术社群运营与开源模型资产共建。

      - company: 地瓜机器人 (D-Robotics)
        position: 官方开发者代表
        location: 中国·北京
        start_date: 2024-05
        end_date: 至今
        summary: 参与国产端侧高算力机器人芯片生态建设与开发者生态推广。
        highlights:
          - 针对 RDK X3 / X5 嵌入式机器人计算平台进行算法适配、性能调优与开源样例开发。
          - 受邀担任全国开发者大会主讲嘉宾，推动国产边缘算力在机器人领域的普及。

    Education:
      - institution: 北京化工大学 (BUCT)
        location: 中国·北京
        area: 机械设计制造及其自动化（巴黎居里工程师背景 / 自动化系）
        studyType: 工学学士
        start_date: 2018-09
        end_date: 2023-06
        highlights:
          - 荣获北京化工大学最高荣誉之一“化大之星 · 校园青春榜样”
          - 获评首都大学生“青年服务国家”先进个人及社会实践优秀团队
          - 获得 ACM 大学生程序设计竞赛、中国高校计算机大赛等省级及以上科技竞赛奖项

    Awards:
