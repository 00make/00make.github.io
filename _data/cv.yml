    具身智能与硬核开源项目:
      - company: WALL-OSS 单卡具身智能极速部署
        position: 独立开发者 / 架构师
        start_date: 2026.01
        end_date: 至今
        summary: 突破消费级硬件算力边界的具身智能端到端方案。
        highlights:
          - 在单张 32GB RTX 5090 显卡上跑通 80 层 Decoder 架构 VLA 模型微调与 LeRobot SO-101 机械臂真机闭环。
          - 运用 8-bit AdamW、Activation Checkpointing、256 步梯度累积等工程优化，将端到端推理动作延迟压缩至 33–100ms。
          - 采集 30 条 / 8199 帧高质量机械臂遥操作轨迹数据集，完整开源至 HuggingFace。

      - company: Genesis 具身 AI 社区
        position: 中国区产品创新与推广负责人
        start_date: 2025.12
        end_date: 至今
        summary: 推动全球通用物理仿真与具身智能学习生态发展。
        highlights:
          - 深度链接清华、北化等顶尖高校实验室开发者，推动跨本体机器人策略在 Genesis 环境下的训练与评估。

      - company: “启迪”桌面级具身智能开发平台
        position: 发起人
        start_date: 2025.08
        end_date: 至今
        summary: 降低高校及个人开发者入门门槛的具身智能软硬件套件。
        highlights:
          - 打造低成本、可复现的双臂/机械臂实验硬件平台，编撰《具身智能从零到一开发指南》。

      - company: 土豆子 (xiaozhi-esp32 边缘 AI 终端)
        position: 硬件与固件开发者
        start_date: 2024.06
        end_date: 2025.03
        summary: 端侧离线大模型与语音交互硬件。
        highlights:
          - 基于 xiaozhi-esp32-server 打造离线语音 + 大模型边缘计算终端，实现 500+ 台硬件量产与交付。

      - company: dmcan 电机控制库 & robodog
        position: 开源作者
        start_date: 2023.01
        end_date: 2024.12
        summary: 机器人高性能执行器控制基础设施。
        highlights:
          - 封装达妙无刷电机 CAN 总线 MIT/力矩/阻抗控制模式，提供 ROS/ROS2 驱动与 C++/Python 接口。
          - robodog 集成 6 轴机械臂与 WebXR 空间交互，实现毫米级空间手势遥操作抓取。

    专业技术栈:
      - company: 技术栈总览
        position: 全栈工程师
        start_date: 2018
        end_date: 至今
        highlights:
          - 技术布道与生态：技术写作、硬核视频制作、大型技术会议讲者、开发者工作坊与课程设计
          - 具身智能与运控：VLA 大模型、LeRobot、ROS/ROS2、正逆运动学/动力学、Sim-to-Real、四足步态
          - 人工智能与大模型：NVIDIA NIM、RAG 检索增强生成、LangChain、Prompt Engineering、端侧推理
          - 嵌入式与硬件：NVIDIA Jetson 系列、ESP32、STM32、CAN 总线通信、PCB 原理图与布线、无刷电机伺服
          - 编程语言与平台：Python、C/C++、Go、Linux (Ubuntu/RT-Linux)、Docker、Git
