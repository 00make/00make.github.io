        date: 2025-12
        summary: 全年黑客松总决赛最高荣誉，PCBTool AI (基于 NVIDIA NIM 智能体) 入选英伟达官方展台展示案例。

      - title: NVIDIA 11th Sky Hackathon 第一名
        awarder: NVIDIA (英伟达)
        date: 2025-10
        summary: 聚焦端侧大模型与边缘 AI 智能体开发，斩获第一名。

      - title: 2025 国际人形机器人技能大赛 全赛道冠军
        awarder: 国际人形机器人技能大赛组委会
        date: 2025-08
        summary: 清华紫荆战队成员，斩获人形机器人足球挑战赛全赛道冠军。

      - title: 首届小红书黑客松巅峰赛 硬件赛道三等奖
        awarder: 小红书技术团队 / 张江高科
        date: 2026-04
        summary: 项目“TRI.ME 吹了么”七轴模块化具身理容机械臂，48 小时极限手搓真机并获奖。

      - title: 2026 世界人工智能大会 (WAIC) 受邀展出
        awarder: WAIC 组委会 / 小红书
        date: 2026-07
        summary: 携“吹了么”具身理容机械臂作为 AI 原生创客与超级个体代表于 WAIC 官方展台公开展出。

      - title: 中关村高新技术企业认证 & 中关村 U30 雏鹰人才
        awarder: 北京市中关村科技园区管委会
        date: 2020-11
        summary: 创办企业获评中关村高新技术企业，个人入选中关村科技创新雏鹰人才。

      - title: 北京化工大学“化大之星·校园青春榜样”
        awarder: 北京化工大学
        date: 2020-10
        summary: 获评全校年度青年榜样学生代表，被学校官方专稿深度报道。

      - title: Bilibili 官方“校园星 UP” (累计播放 200 万+)
        awarder: 哔哩哔哩 (Bilibili)
        date: 2021-06
        summary: 频道「超级无敌麻辣串」，单期机器人软硬件与 AI 视频最高播放破百万，累计超 200 万次。

      - title: 中国计算机学会 (CCF) 宣传大使
        awarder: 中国计算机学会 (CCF)
        date: 2020-05
        summary: 积极推广计算机科学与工程开源文化。

    Projects:
      - name: 单卡消费级 GPU 跑通 80 层 VLA 模型（WALL-OSS）全链路微调与真机闭环
        date: 2026-01
        url: https://github.com/00make
        summary: 突破消费级硬件算力边界的具身智能端到端方案。
        highlights:
          - 在单张 32GB RTX 5090 显卡上跑通 80 层 Decoder 架构 VLA 模型微调与 LeRobot SO-101 机械臂真机闭环。
          - 运用 8-bit AdamW、Activation Checkpointing、256 步梯度累积等工程优化，将端到端动作延迟压缩至 33–100ms。
          - 采集 30 条 / 8199 帧高质量机械臂遥操作轨迹数据集，完整开源至 HuggingFace。

      - name: “吹了么” (TRI.ME) 模块化具身理容机械臂
        date: 2026-04
        summary: 48 小时极速交付的七轴机械臂与多模态大模型生活服务具身智能项目。
        highlights:
          - 斩获小红书首届“黑客松巅峰赛”硬件赛道三等奖。
          - 受邀亮相 2026 世界人工智能大会 (WAIC) 现场公开展出。
          - 获人民网、解放日报·上观新闻、China Daily、雷科技专题报道。

      - name: robodog & AgentOS 机器人智能体操作系统
        date: 2024-08
        summary: 面向多本体机器人的统一跨平台 Agent 控制中间件。
        highlights:
          - 封装底层四足步态、机械臂正逆运动学与传感器数据，提供统一易用的 Python SDK。
          - 支持大模型与自然语言意图规划，驱动物理硬件执行空间动作。

      - name: PCBTool AI (NVIDIA NIM 智能体)
        date: 2025-10
        summary: 基于英伟达 NIM 容器化微服务搭建的自动化电路与硬件设计 AI 助手。
        highlights:
          - 荣获 2025 NVIDIA Hackathon 年度总决赛冠军，并在英伟达展台作为优秀案例官方展示。

      - name: 土豆子 (xiaozhi-esp32 边缘 AI 终端)
        date: 2024-06
        summary: 端侧离线大模型与语音交互硬件。
        highlights:
          - 打造离线语音 + 大模型边缘计算终端，实现 500+ 台硬件量产与交付。

      - name: treehollow 开源校园社交平台
        date: 2019-09
        summary: 服务青年大学生的开源高并发社交与生活服务网络。
        highlights:
          - 覆盖全国 34 所高校，日活跃用户超 10 万+。

    Skills:
      - name: 具身智能与大模型
        keywords: [VLA 模型微调, LeRobot, 物理仿真 (Genesis / Isaac Sim), ROS/ROS2, 手眼标定, Sim-to-Real]

      - name: 机器人运控与嵌入式
        keywords: [FOC 无刷电机控制, CAN 总线通信 (MIT模式), RTOS, STM32, ESP32, 传感器融合]

      - name: 边缘计算与软硬件架构
        keywords: [NVIDIA Jetson, 地瓜机器人 RDK, Docker 容器化, Linux (Ubuntu/RT-PREEMPT), PCB 原理图与布线]

      - name: 编程语言与工程栈
        keywords: [Python, C/C++, Go, PyTorch, LangChain, NVIDIA NIM, Git]

      - name: 技术布道与生态运营
        keywords: [200万+ B站科技 UP 主, 黑客松发起与组织, 技术演讲与讲座, 开源社群构建]

