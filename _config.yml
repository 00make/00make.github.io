# -----------------------------------------------------------------------------
# Get external JSON data
# -----------------------------------------------------------------------------

# Intentionally empty. The upstream starter used this to load Albert Einstein's
# demo `assets/json/resume.json` for the `cv_format: jsonresume` renderer. This
# site renders its CV with `cv_format: rendercv` from `_data/cv.yml` instead, so
# there is no external JSON resume to fetch. Add entries here only if you switch
# a page back to `cv_format: jsonresume`.
jekyll_get_json: []

# Section order used by the jsonresume CV renderer. Inert while no page sets
# `cv_format: jsonresume`; kept so the renderer's config contract stays intact.
jsonresume:
  - basics
  - work
  - education
  - publications
  - projects
  - volunteer
  - awards
  - certificates
  - skills
  - languages
  - interests
  - references
